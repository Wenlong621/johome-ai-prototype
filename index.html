<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Johome AI Buying Agent · 交互原型</title>
<meta name="description" content="Johome Community Buying AI 选区助手手机端可交互原型"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --color-background-primary:#ffffff;
  --color-background-secondary:#f4f3ee;
  --color-background-tertiary:#faf9f5;
  --color-text-primary:#1d1d1a;
  --color-text-secondary:#6b6a63;
  --color-text-tertiary:#9b998f;
  --color-border-tertiary:rgba(0,0,0,0.10);
  --color-border-secondary:rgba(0,0,0,0.18);
  --color-background-info:#e6f1fb;--color-text-info:#0c447c;
  --color-background-warning:#faeeda;--color-text-warning:#854f0b;
  --color-background-success:#e1f5ee;--color-text-success:#0f6e56;
  --border-radius-md:8px;--border-radius-lg:12px;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#eceae3;font-family:var(--font-sans);color:var(--color-text-primary);padding:22px 12px 40px;-webkit-font-smoothing:antialiased}
.page-title{max-width:330px;margin:0 auto 14px;text-align:center}
.page-title h1{font-size:18px;font-weight:500;margin:0 0 4px}
.page-title p{font-size:12.5px;color:var(--color-text-secondary);margin:0;line-height:1.5}
#jhp{max-width:330px;margin:0 auto}
.jhp-cap{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--color-text-secondary);margin:0 0 12px 2px;line-height:1.45}
.jhp-cap i{color:#0F6E56;font-size:16px;margin-top:2px}
.ph{width:300px;margin:0 auto;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:30px;padding:7px;box-shadow:0 8px 30px rgba(0,0,0,0.10)}
.scr{height:632px;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;background:var(--color-background-tertiary)}
.sb{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 4px;font-size:11px;color:var(--color-text-primary);background:var(--color-background-primary);flex:none}
.sb .ri{display:flex;gap:5px;font-size:13px}
.stage{flex:1;min-height:0;position:relative}
.view-chat{display:flex;flex-direction:column;height:100%}
.view-detail{display:none;flex-direction:column;height:100%}
.hd{display:flex;align-items:center;gap:9px;padding:7px 12px 9px;background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);flex:none}
.bk{font-size:20px;color:var(--color-text-secondary);cursor:pointer}
.hav{width:30px;height:30px;border-radius:50%;background:#0F6E56;display:flex;align-items:center;justify-content:center;flex:none}
.hav i{font-size:16px;color:#fff}
.pref{display:flex;align-items:center;gap:7px;padding:8px 12px;background:#E1F5EE;border-bottom:0.5px solid #9FE1CB;flex:none;cursor:pointer}
.pc{font-size:11.5px;color:#0F6E56;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.editbtn{display:flex;align-items:center;gap:2px;font-size:11.5px;color:#0F6E56;white-space:nowrap}
.chat,.dscroll{flex:1;min-height:0;overflow-y:auto;padding:12px 11px;display:flex;flex-direction:column;gap:11px}
.dscroll{gap:11px;background:var(--color-background-tertiary)}
.row{display:flex;gap:7px;align-items:flex-start}
.row.me{justify-content:flex-end}
.av{width:26px;height:26px;border-radius:50%;background:#0F6E56;display:flex;align-items:center;justify-content:center;flex:none}
.av i{font-size:14px;color:#fff}
.bub{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:14px;border-top-left-radius:4px;padding:9px 11px;font-size:12.5px;line-height:1.55;max-width:215px}
.ubub{background:#0F6E56;color:#fff;border-radius:14px;border-top-right-radius:4px;padding:9px 11px;font-size:12.5px;line-height:1.55;max-width:210px}
.qr{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;padding-left:33px}
.q{padding:6px 11px;border-radius:999px;font-size:12px;border:0.5px solid #1D9E75;color:#0F6E56;background:transparent;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.q:hover{background:#E1F5EE}
.q.on{background:#0F6E56;color:#fff;border-color:#0F6E56}
.inbar{display:flex;align-items:center;gap:8px;padding:9px 11px;border-top:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);flex:none}
.inp{flex:1;height:36px;border-radius:999px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);padding:0 14px;font-size:12.5px;color:var(--color-text-primary);outline:none}
.send{width:34px;height:34px;border-radius:50%;background:#0F6E56;border:none;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;padding:0}
.send i{color:#fff;font-size:18px}
.cc{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:11px}
.cc[data-tap],.cc[data-more]{cursor:pointer}
.cc[data-tap]:hover,.cc[data-more]:hover{border-color:#1D9E75}
.score{width:34px;height:34px;border-radius:50%;background:#E1F5EE;border:1.5px solid #1D9E75;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.score b{font-size:14px;font-weight:500;color:#0F6E56;line-height:1}
.score s{font-size:8px;color:#0F6E56;text-decoration:none}
.met{background:var(--color-background-secondary);border-radius:6px;padding:6px 8px}
.met .v{font-size:13px;font-weight:500}
.met .l{font-size:10.5px;color:var(--color-text-secondary)}
.met.mtab.on,.met.stab.on{outline:1.5px solid #1D9E75;background:#E1F5EE}
.hero{position:relative;height:172px;border-radius:12px;overflow:hidden;flex:none;background:var(--color-background-secondary)}
.heroSlides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.heroSlides::-webkit-scrollbar{display:none}
.heroSlide{flex:0 0 100%;height:100%;scroll-snap-align:start}
.heroSlide img{width:100%;height:100%;object-fit:cover;display:block}
.cmap{width:100%;height:100%}
.heroDots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:600}
.heroDots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.55);cursor:pointer;box-shadow:0 0 2px rgba(0,0,0,0.35)}
.heroDots span.on{background:#fff}
.heroHint{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.5);color:#fff;font-size:10.5px;padding:3px 8px;border-radius:999px;z-index:600;display:flex;align-items:center;gap:3px}
.heroTag{position:absolute;bottom:8px;left:8px;background:#0F6E56;color:#fff;font-size:10.5px;font-weight:500;padding:4px 10px;border-radius:999px;z-index:600}
.leaflet-container{font-family:var(--font-sans);background:#e8e6df}
.drow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:0.5px solid var(--color-border-tertiary)}
.drow .dl{font-size:12px;color:var(--color-text-secondary)}
.drow .dv{font-size:13px;font-weight:500}
.dgrp{font-size:11px;color:var(--color-text-tertiary);font-weight:500;margin:9px 2px 1px}
.poiMapWrap{height:200px;border-radius:12px;overflow:hidden;margin-top:8px;border:0.5px solid var(--color-border-tertiary)}
.ptabrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ptabrow::-webkit-scrollbar{display:none}
.ptab{flex:none;padding:5px 11px;border-radius:999px;font-size:12px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;white-space:nowrap}
.ptab.on{background:#0F6E56;color:#fff;border-color:#0F6E56}
.stnwrap{display:flex;flex-wrap:wrap;gap:6px}
.stn{display:inline-flex;align-items:center;font-size:11px;color:var(--color-text-secondary);background:var(--color-background-secondary);border-radius:999px;padding:4px 9px}
.thumb{width:54px;height:48px;border-radius:8px;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;flex:none;color:var(--color-text-tertiary)}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:10.5px}
.muted{color:var(--color-text-secondary)}
.sec{font-size:12.5px;font-weight:500;margin:0 0 7px}
.field{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:8px;padding:10px;font-size:12.5px;color:var(--color-text-primary)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:8px;font-size:13px;font-weight:500;background:#0F6E56;color:#fff;border:none;cursor:pointer}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--color-text-tertiary);margin:0 1px;animation:jblink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes jblink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.rst{display:block;margin:14px auto 0;font-size:12px;color:var(--color-text-secondary);background:transparent;border:0.5px solid var(--color-border-secondary);border-radius:999px;padding:6px 14px;cursor:pointer}

































































































































































/* ===== v4 layer (spec 2026-10-28): 地图在底 + 三段式 sheet、结果先行、放宽 chips、每日推荐、可负担性 ===== */
.v4body{flex:1;min-height:0;position:relative;overflow:hidden}
#v4map{position:absolute;inset:0;background:#e9ecef}
.v4legend{position:absolute;top:8px;right:8px;z-index:500;display:flex;gap:4px}
.v4legend button{padding:3px 8px;border-radius:999px;font-size:10px;border:0.5px solid var(--color-border-secondary);background:rgba(255,255,255,.92);color:var(--color-text-secondary);cursor:pointer}
.v4legend button.on{background:#0F6E56;color:#fff;border-color:#0F6E56}
.v4sheet{position:absolute;left:0;right:0;bottom:0;height:52%;background:var(--color-background-tertiary);border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:600;transition:height .25s ease}
.v4sheet.min{height:15%}.v4sheet.half{height:52%}.v4sheet.full{height:92%}
.v4sheet.min .chat{display:none}
.v4handle{height:16px;flex:none;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.v4handle span{width:36px;height:4px;border-radius:999px;background:var(--color-border-secondary)}
.v4sheet .chat{flex:1;padding-top:4px}
.v4turn{display:flex;flex-direction:column;gap:9px}
.v4scroll{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.v4scroll>.cc{scroll-snap-align:center;flex:none;width:168px!important;min-width:168px}
.v4scroll>.cc .im{position:relative}
.v4pin{position:absolute;right:6px;top:6px;background:#0F6E56;color:#fff;border-radius:999px;font-size:10px;font-weight:600;padding:1px 6px;z-index:2}
.v4pinwrap{background:transparent;border:none}
.v4mpin{transform:translate(-50%,-100%);background:#fff;border:1.5px solid #0F6E56;border-radius:10px;padding:2px 6px 2px 3px;font-size:10px;white-space:nowrap;display:inline-flex;gap:4px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.22);color:#0F6E56;font-weight:500}
.v4mpin b{background:#0F6E56;color:#fff;border-radius:999px;padding:0 5px;font-size:10px}
.v4mpin.on{background:#0F6E56;color:#fff}.v4mpin.on b{background:#fff;color:#0F6E56}
.v4ptpin{transform:translate(-50%,-50%);background:#fff;border:1.5px solid #8A5A0B;color:#8A5A0B;border-radius:999px;padding:2px 6px;font-size:10px;white-space:nowrap;display:inline-flex;gap:3px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.leaflet-tooltip.v4tip{background:transparent;border:none;box-shadow:none;font-size:10px;color:#0F6E56;font-weight:600;text-shadow:0 0 3px #fff,0 0 3px #fff}
.leaflet-tooltip.v4tip:before{display:none}
.v4undo{font-size:11px;color:var(--color-text-secondary);background:var(--color-background-secondary);border-radius:10px;padding:6px 9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1}
.v4askb{background:#FFF7E6;border-color:#F0D9A8}
.q.ghost{border-color:var(--color-border-secondary);color:var(--color-text-secondary)}
.v4apr{margin-top:6px;padding-top:6px;border-top:0.5px solid var(--color-border-tertiary)}
.v4aff .met .v{font-size:13px}
.v4hdbtn{font-size:19px;cursor:pointer;margin-right:8px}
.v4sbar{display:flex;gap:8px;padding:8px 11px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);flex:none;align-items:center}
#v4smap{height:150px;flex:none;background:#e9ecef}
.v3lc{width:168px;flex:none;padding:0;overflow:hidden}
.v3lc .im{height:72px;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;color:var(--color-text-tertiary);position:relative}
.v3lc .im .tag{position:absolute;left:6px;top:6px}
.v3lc .bd{padding:7px 9px}
.v3lc .rs{font-size:10px;color:#0F6E56;margin-top:4px;line-height:1.4}
.v3warn{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;font-size:10px;background:#FDECEC;color:#B23B2E}
.v3und{background:var(--color-background-secondary);border-radius:10px;padding:7px 9px;font-size:11px;color:var(--color-text-secondary);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.v3und .tag{background:var(--color-background-primary);color:var(--color-text-primary);border:0.5px solid var(--color-border-tertiary)}
.v3und .tag.neg{background:#FDECEC;color:#B23B2E;border-color:#F5C2C2}
.v3und .tag.mode{background:#0F6E56;color:#fff;border-color:#0F6E56}
.v3und .tag.soft{color:var(--color-text-tertiary);border-style:dashed}
.v3sheet{position:absolute;left:0;right:0;bottom:0;height:82%;background:var(--color-background-primary);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;z-index:900}
.v3sheet .sh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:0.5px solid var(--color-border-tertiary);flex:none}
.v3sheet .sm{flex:1;overflow-y:auto;padding:10px 11px;display:flex;flex-direction:column;gap:9px;min-height:0}
.v3sheet .sin{display:flex;gap:8px;padding:8px 11px;border-top:0.5px solid var(--color-border-tertiary);flex:none;align-items:center}
.v3sheet .sin input{flex:1;border:0.5px solid var(--color-border-secondary);border-radius:999px;padding:8px 12px;font-size:12.5px;background:var(--color-background-secondary)}
.v3chips{display:flex;gap:6px;flex-wrap:wrap}
.v3ck{display:flex;gap:9px;align-items:flex-start;padding:9px 10px}
.v3ck input{margin-top:3px;flex:none}
.v3ck .ckt{font-size:11.5px;color:var(--color-text-secondary)}
.v3ck .ckv{font-size:12.5px;margin-top:2px;line-height:1.45}
.v3av{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font-size:11px;background:#FDECEC;color:#B23B2E;border:0.5px solid #F5C2C2}
.v3av.soft{background:#FFF7E6;color:#8A5A0B;border-color:#F0D9A8}
.v3av i{cursor:pointer;font-size:11px}
.v3mini{padding:4px 9px;border-radius:999px;font-size:11px;border:none;background:#0F6E56;color:#fff;display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.v3mini.ghost{background:transparent;border:0.5px solid #B07A12;color:#6B4E12}
.v4tiles{filter:saturate(.55) brightness(1.04)}
.v4body.nomap #v4map,.v4body.nomap .v4legend{display:none}
.v4body.nomap .v4sheet{height:100%!important;border-radius:0;box-shadow:none;transition:none}
.v4body.nomap .v4handle{display:none}
.rst.v4srch{margin-top:8px}
.v4askrow{display:flex;gap:6px;align-items:flex-start;margin-top:6px}
.v4askl{font-size:11px;color:var(--color-text-secondary);flex:none;width:34px;padding-top:7px}
.v4askrow .qr{margin-top:0;flex:1}
.v4askin{height:28px;font-size:11px;padding:0 10px;margin-top:4px;width:100%;box-sizing:border-box}
.v4askq .q.on{background:#0F6E56;color:#fff;border-color:#0F6E56}
.v4pickq .q.on{background:#0F6E56;color:#fff;border-color:#0F6E56}
.v3und .tag.new{border-color:#0F6E56;color:#0F6E56;font-weight:600}

.v4cmp{width:100%;border-collapse:collapse;font-size:11.5px;background:var(--color-background-primary);border-radius:10px;overflow:hidden}.v4cmp th,.v4cmp td{border-top:0.5px solid var(--color-border-tertiary);padding:5px 5px;text-align:left;vertical-align:top;line-height:1.4}.v4cmp tr:first-child th{border-top:0}.v4cmp th{font-weight:500;color:#0F6E56;font-size:11.5px}.v4cmp td.k{color:var(--color-text-secondary);white-space:nowrap;width:64px}

.v4fitb{max-height:38px;overflow:hidden;position:relative}.v4fitb.open{max-height:none}.v4fitb:not(.open):after{content:'';position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(rgba(225,245,238,0),#E1F5EE)}.v4fitmore{display:inline-flex;align-items:center;gap:3px;margin-top:6px;padding:0;border:0;background:transparent;color:#0F6E56;font-size:11.5px;cursor:pointer}
/* 对话区字号整体收小（Mike 2026-11-06：少滚动） */
#jhp .chat .bub{font-size:11px;line-height:1.45;padding:7px 10px;max-width:228px}
#jhp .chat .ubub{font-size:11px;line-height:1.45;padding:7px 10px;max-width:220px}
#jhp .chat .av{width:22px;height:22px}#jhp .chat .av i{font-size:12px}
#jhp .chat .row{gap:6px}#jhp .chat .qr{gap:5px;padding-left:28px}
#jhp .chat .q{font-size:10.5px;padding:4px 9px}
#jhp .chat .v3und{font-size:10px;padding:6px 8px;gap:4px}#jhp .chat .v3und .tag{font-size:10px;padding:2px 6px}
#jhp .chat .v4undo{font-size:10px;padding:5px 8px}#jhp .chat .v4undo .v3mini{font-size:10px;padding:2px 7px}
#jhp .chat .v4askl{font-size:10px;width:32px;padding-top:6px}#jhp .chat .v4askin{height:28px;font-size:11px}
#jhp .chat .v4cmp{font-size:10.5px}#jhp .chat .v4cmp th,#jhp .chat .v4cmp td{padding:4px 4px}
#jhp .chat .cc{padding:9px}#jhp .chat .cc .muted{font-size:10px}

.v4fb{display:flex;gap:6px;margin-top:6px}#jhp .chat .v4fb .q{font-size:10.5px;padding:3px 9px}

#jhp .chat .v3und .v3mini{margin-left:auto;font-size:10px;padding:2px 8px}
.v3und .tag.lbl{background:none;border:0;padding:0 0 0 3px;color:var(--color-text-tertiary);font-weight:500}.v3und .tag.lbl.now{color:#0F6E56}#jhp .chat .v3und .tag.lbl{padding:0 0 0 3px}
.v3und .tag.brk{flex-basis:100%;height:0;padding:0!important;border:0;margin:-2px 0;background:none}.v3und .tag.lbl{min-width:34px}
#jhp .bub .pkl{margin-top:8px}
#jhp .bub .pkn{font-weight:600;display:flex;align-items:center;gap:6px;color:var(--color-text-primary)}
#jhp .bub .pki{flex:none;width:15px;height:15px;border-radius:50%;background:#0F6E56;color:#fff;font-size:9.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
#jhp .bub .pkw{margin:2px 0 0 21px;color:var(--color-text-secondary);line-height:1.5}
#jhp .bub .pkh{margin-top:8px;font-size:10px;color:var(--color-text-tertiary)}

/* 房源详情页：顶栏的「问 AI」、吸底的经纪栏（现有 App 的栏，示意）、「问 AI」半屏里的行动按钮 */
.v4asktop{display:inline-flex;align-items:center;gap:4px;flex:none;padding:5px 11px;border-radius:999px;border:none;background:#0F6E56;color:#fff;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.v4agbar{gap:9px}
.v4agav{flex:none;width:34px;height:34px;border-radius:50%;background:var(--color-background-secondary);color:var(--color-text-secondary);display:flex;align-items:center;justify-content:center;font-size:18px}
.v4agnm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4agbtn{flex:none;display:inline-flex;align-items:center;gap:4px;padding:8px 11px;border-radius:8px;border:0.5px solid #1D9E75;background:var(--color-background-primary);color:#0F6E56;font-size:12.5px;font-weight:500;cursor:default;white-space:nowrap}
.v3sheet .sact{display:flex;align-items:center;gap:7px;padding:7px 11px 0;flex:none;font-size:11px}
.v3sheet .sact .q.no{border-color:#E4B4AD;color:#B23B2E}


/* 一次回答的所有块放进同一个回答框：一个头像、一个框，块之间靠间距分开；框里的导语不再套气泡 */
.v4box{flex:1;min-width:0;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:14px;border-top-left-radius:4px;padding:9px 10px;display:flex;flex-direction:column;gap:9px}
.v4box .v4sec{min-width:0;display:flex;flex-direction:column}
.v4box .v4sec>*{min-width:0}
#jhp .chat .v4box .bub,.v4box .bub{background:none;border:0;border-radius:0;padding:0;max-width:none}
.v4box .v4cards{flex:none}
.v3und .v4kept{margin-left:auto;font-size:10px}

.v3und .v4saved{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#0F6E56}

/* AI 的回复前面不放头像，回复占满整行宽度（用户说的话仍靠右）；「问 AI」半屏同样处理 */
#jhp .chat .row>.av,.v3sheet .sm .row>.av{display:none}
#jhp .chat .qr{padding-left:0}
#jhp .chat .bub{max-width:100%}
.v4box{border-top-left-radius:14px}

/* 回复不加外框：回答框只负责把各块排在一起，没有边框、底色和内边距；单条回复也是纯文字。用户说的话仍是右侧的气泡 */
.v4box{background:none;border:0;border-radius:0;padding:0}
#jhp .chat .row:not(.me)>.bub,.v3sheet .sm .row:not(.me)>.bub{background:none;border:0;border-radius:0;padding:0 1px;max-width:100%}

/* 回答里的按钮行稍微收紧一点，让「把 X 加入到关注的城市」和「换一批」在窄屏上也能排在同一行 */
#jhp .chat .v4box .qr{gap:4px}
#jhp .chat .v4box .qr .q{padding:4px 8px}

/* 「为你而选」块：每条理由一行，✓ 条件：事实；不符合的 ✗ 红字 */
.v4fitrow{display:flex;gap:5px;align-items:flex-start}
.v4fitrow i{flex:none;margin-top:3px;font-size:11px;color:#0F6E56}
.v4fitrow b{font-weight:500}
.v4fitrow.bad,.v4fitrow.bad i{color:#B23B2E}

/* 对话区完全展开（收起地图）时盖满整个区域：不露出地图边和右上角的图层按钮；顶部的拖动条保留，往下拉可以重新露出地图 */
.v4sheet.full{height:100%;border-radius:0;box-shadow:none}

/* 详情页右上的「问 AI」是一个图标 */
.v4asktop{width:30px;height:30px;padding:0;justify-content:center;border-radius:50%;font-size:15px}
/* 主会话里聊某套房：用户一侧的房源卡、引导问题、输入框上方的「正在聊」 */
#jhp .chat .ubub.v4askcard{padding:8px;max-width:236px;width:236px}
.v4askcard .t{font-size:11.5px;margin:0 2px 6px}
.v4askcard .c{display:flex;gap:8px;align-items:center;background:var(--color-background-primary);color:var(--color-text-primary);border-radius:10px;padding:7px;cursor:pointer}
.v4askcard .im{flex:none;width:44px;height:44px;border-radius:8px;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;color:var(--color-text-tertiary);font-size:18px}
.v4askcard .bd{min-width:0}
.v4askcard .p{font-size:13px;font-weight:600}
.v4askcard .s{font-size:10.5px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v4askwrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.v4sqrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);font-size:12px;color:var(--color-text-primary);cursor:pointer}
.v4sqrow i{flex:none;color:#0F6E56;font-size:15px}
.v4sqrow span{flex:1;min-width:0}
.v4focus{display:flex;align-items:center;gap:6px;padding:5px 12px;font-size:11px;color:#0F6E56;background:#E1F5EE;border-top:0.5px solid #9FE1CB;flex:none}
.v4focus span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.v4focus [data-x]{cursor:pointer;color:var(--color-text-secondary);font-size:13px}
#jhp .chat .v4askwrap>.bub{background:none;border:0;border-radius:0;padding:0 1px;max-width:100%}
/* 「AI 理解为」分行写：意图、范围、其余条件各一行；同一行的各项用逗号隔开，不用标签；「不考虑」的用红字 */
.v3und .v4undtx{flex:1 1 100%;min-width:0;line-height:1.6;color:var(--color-text-secondary)}
.v3und .v4undtx i{margin-right:4px}
.v3und .v4undlb{margin-right:2px}
.v3und .v4uc{color:var(--color-text-primary)}
.v3und .v4uc.neg{color:#B23B2E}
.v3und .v4ui{display:inline-block;max-width:100%}
</style>
</head>
<body>
<div class="page-title"><h1>⛳ Johome AI Buying Agent · 交互原型</h1><p>手机端 AI 找房 Agent v4 · 直接打字即可体验（示例数据）</p></div>
<div id="jhp">

<div class="ph"><div class="scr">
  <div class="sb"><span>9:41</span><span class="ri"><i class="ti ti-signal-4g"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i></span></div>
  <div class="stage">
    <div class="view-chat">
      <div class="hd"><i class="ti ti-arrow-left bk"></i><div class="hav"><i class="ti ti-sparkles"></i></div><div style="flex:1"><div style="font-size:13.5px;font-weight:500">Johome AI</div><div style="font-size:10.5px;color:#1D9E75">您的智能找房/选区/地产投资AI助手</div></div><i class="ti ti-dots muted" style="font-size:20px"></i></div>
      <div class="pref" id="profStrip"><i class="ti ti-adjustments" style="color:#0F6E56;font-size:15px"></i><span class="pc">AI 会边聊边记录你的偏好</span><span class="editbtn">我的档案<i class="ti ti-chevron-right" style="font-size:14px"></i></span></div>
      <div class="chat">
      </div>
      <div class="inbar"><input class="inp" placeholder="用自然语言告诉我你的需求…"/><i class="ti ti-microphone muted" style="font-size:19px"></i><button class="send"><i class="ti ti-arrow-up"></i></button></div>
    </div>
    <div class="view-detail"></div>
  </div>
</div></div>
<button class="rst"><i class="ti ti-refresh" style="font-size:13px;vertical-align:-2px"></i> 重新开始演示</button>
</div>
<script>
(function(){
  var root=document.getElementById('jhp');
  var list=root.querySelector('.chat');
  var pc=root.querySelector('.pc');
  var chatView=root.querySelector('.view-chat');
  var detail=root.querySelector('.view-detail');
  var inp=root.querySelector('.inp');
  var sendBtn=root.querySelector('.send');
  var initHTML=list.innerHTML;
  var profile={purpose:'',anchor:'',tCity:'',tZone:'',tNb:'',district:'',dest:'',mode:'',time:'',budget:'',htype:'',beds:'',baths:'',sqftMin:'',age:'',parking:'',nearTransit:'',features:'',pet:'',family:'',kids:'',firstTime:'',vibe:'',view:'',amenities:'',safety:'',lifeSvc:'',invGoal:'',riskStyle:'',cityFocus:'',priority:'',tone:'',recDim:'',schoolPref:'',vacaScene:'',vacaFreq:'',vacaRent:'',yield:'',rentability:'',hold:'',timeline:'',preApproved:'',downPay:'',school:''};
  var answer=null,lastResult=null,stack=[],profileEdit=false;
  var BUD=[{label:'80–120万'},{label:'120–160万'},{label:'>160万'}];var BUDI=[{label:'60万以内'},{label:'60–80万'},{label:'80–120万'},{label:'120–160万'},{label:'160–250万'},{label:'250万以上'}];
  var TYP=[{label:'Townhouse'},{label:'Condo'},{label:'独立屋'},{label:'楼花'}];
  var TIM=[{label:'30分钟'},{label:'45分钟'},{label:'60分钟'}];
  var INV=[{label:'现金流'},{label:'增值'},{label:'都要'}];
  var MODE=[{label:'开车'},{label:'公交'},{label:'步行'}];
  var BEDS=[{label:'1室'},{label:'2室'},{label:'3室'},{label:'4室+'}];
  var BATHS=[{label:'1浴'},{label:'2浴'},{label:'3浴+'}];
  var AGE=[{label:'全新'},{label:'楼花'},{label:'二手'},{label:'不限'}];
  var PARK=[{label:'1车位'},{label:'2车位+'}];
  var KIDS=[{label:'学龄前'},{label:'小学'},{label:'中学'},{label:'暂无'}];
  var VIBE=[{label:'热闹'},{label:'安静'}];
  var TLINE=[{label:'尽快'},{label:'3个月内'},{label:'半年内'},{label:'一年内'},{label:'再看看'}];
  var PREAP=[{label:'已预批'},{label:'未预批'}];
  var YN=[{label:'是'},{label:'否'}];
  var FIELDS=[
    {k:'tCity',label:'目标城市',group:'目标区域与通勤'},
    {k:'tZone',label:'目标生活圈',group:'目标区域与通勤'},
    {k:'tNb',label:'目标社区',group:'目标区域与通勤'},
    {k:'district',label:'目标商圈',group:'目标区域与通勤'},
    {k:'school',label:'目标学校',group:'目标区域与通勤'},
    {k:'dest',label:'通勤目的地',group:'目标区域与通勤'},
    {k:'mode',label:'通勤方式',group:'目标区域与通勤',edit:MODE},
    {k:'time',label:'可接受通勤',group:'目标区域与通勤',edit:TIM},
    {k:'budget',label:'预算',group:'预算与房型',edit:BUD},
    {k:'htype',label:'房型',group:'预算与房型',edit:TYP},
    {k:'beds',label:'卧室数',group:'预算与房型',edit:BEDS},
    {k:'baths',label:'浴室数',group:'预算与房型',edit:BATHS},
    {k:'sqftMin',label:'最小面积',group:'预算与房型'},
    {k:'age',label:'房龄偏好',group:'预算与房型',edit:AGE},
    {k:'parking',label:'车位',group:'房源细节',edit:PARK},
    {k:'nearTransit',label:'近轨道交通',group:'房源细节'},
    {k:'features',label:'必备配置',group:'房源细节'},
    {k:'pet',label:'宠物友好',group:'房源细节'},
    {k:'family',label:'家庭结构',group:'家庭与学校'},
    {k:'kids',label:'孩子学段',group:'家庭与学校',edit:KIDS},
    {k:'schoolPref',label:'学校类型/课程偏好',group:'家庭与学校'},
    {k:'firstTime',label:'首次购房',group:'家庭与学校',edit:YN},
    {k:'priority',label:'最看重',group:'生活偏好'},
    {k:'cityFocus',label:'选区侧重',group:'生活偏好'},
    {k:'tone',label:'生活调性',group:'生活偏好'},
    {k:'vibe',label:'氛围偏好',group:'生活偏好',edit:VIBE},
    {k:'view',label:'景观偏好',group:'生活偏好'},
    {k:'amenities',label:'周边设施',group:'生活偏好'},
    {k:'safety',label:'看重安全',group:'生活偏好'},
    {k:'lifeSvc',label:'生活服务',group:'生活偏好'},
    {k:'timeline',label:'购房时间线',group:'时间线与资金',edit:TLINE},
    {k:'preApproved',label:'贷款预批',group:'时间线与资金',edit:PREAP},
    {k:'downPay',label:'首付比例',group:'时间线与资金'}
  ];

  function esc(s){return (''+s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function scroll(){list.scrollTop=list.scrollHeight;}
  function addAI(html){var r=document.createElement('div');r.className='row';r.innerHTML='<div class="av"><i class="ti ti-sparkles"></i></div><div class="bub">'+html+'</div>';list.appendChild(r);scroll();}
  function addUser(t){var r=document.createElement('div');r.className='row me';r.innerHTML='<div class="ubub">'+esc(t)+'</div>';list.appendChild(r);scroll();}
  function clearLive(){var n=list.querySelectorAll('.qr.live');for(var i=0;i<n.length;i++)n[i].remove();}
  function quick(opts){var w=document.createElement('div');w.className='qr live';opts.forEach(function(o){var b=document.createElement('button');b.className='q';b.innerHTML=(o.icon?'<i class="ti '+o.icon+'"></i>':'')+o.label;b.onclick=function(){pick(o.label);};w.appendChild(b);});list.appendChild(w);scroll();}
  function quickAct(opts,cls){flushReason();var w=document.createElement('div');w.className='qr'+(cls?' '+cls:'');opts.forEach(function(o){var b=document.createElement('button');b.className='q';b.innerHTML=(o.icon?'<i class="ti '+o.icon+'"></i>':'')+o.label;b.onclick=o.fn;w.appendChild(b);});list.appendChild(w);scroll();}
  function pick(v){if(answer===null)return;addUser(v);clearLive();var f=answer;answer=null;f(v,false);}
  function typing(cb){var r=document.createElement('div');r.className='row';r.innerHTML='<div class="av"><i class="ti ti-sparkles"></i></div><div class="bub"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';list.appendChild(r);scroll();setTimeout(function(){r.remove();cb();},600);}
  function disablePickables(){var n=list.querySelectorAll('.qr.pickable button'),i;for(i=0;i<n.length;i++){n[i].disabled=true;n[i].style.opacity='0.45';n[i].style.pointerEvents='none';}}
  function ask(html,opts,resolver){flushReason();disablePickables();typing(function(){addAI(html);if(opts)quick(opts);answer=resolver;});}
  function askInput(html,examples,resolver){flushReason();disablePickables();typing(function(){addAI(html);if(examples)quick(examples);answer=resolver;inp.focus();});}
  function addBlock(html,tapFn){var r=document.createElement('div');r.className='row';r.innerHTML='<div class="av"><i class="ti ti-sparkles"></i></div>';var d=document.createElement('div');d.style.flex='1';d.style.minWidth='0';d.innerHTML=html;r.appendChild(d);list.appendChild(r);if(tapFn){var n=d.querySelectorAll('[data-tap]');for(var i=0;i<n.length;i++){(function(el){el.addEventListener('click',function(){tapFn(el.getAttribute('data-tap'),el.getAttribute('data-city')||'');});})(n[i]);}}scroll();}
  function pref(){var cnt=0;for(var i=0;i<FIELDS.length;i++){if(profile[FIELDS[i].k])cnt++;}pc.textContent=cnt?('已记录 '+cnt+' 项偏好'):'AI 会边聊边记录你的偏好';}
  function askBudget(next){var inv=/投资/.test(profile.purpose||'')||/投资/.test(profile.anchor||'');ask('预算大概多少？',inv?BUDI:BUD,function(v){profile.budget=v;pref();next();});}
  function askType(next){ask('想要什么房型？',TYP,function(v){profile.htype=v;pref();next();});}
  function askListingReqs(next){var askBd=function(){if(profile.beds)next();else ask('想要几房（卧室数）？',BEDS,function(v){profile.beds=v;pref();next();});};var askB=function(){if(profile.budget)askBd();else askBudget(askBd);};if(profile.htype)askB();else askType(askB);}

  function subCity(sub){var t=(''+(sub||'')).split('·')[0].trim();var M={'West Van':'West Vancouver','North Van':'North Vancouver','New West':'New Westminster','Van West':'Vancouver West','Van East':'Vancouver East'};return M[t]||t;}
  function cardBg(img){return img?('<div style="position:absolute;inset:0;background:url('+img+') center/cover no-repeat;opacity:.15;pointer-events:none"></div><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.78) 78%);pointer-events:none"></div>'):'';}
  function ncard(name,sub,sc,line,m1,m1l,m2,m2l){var ct=subCity(sub);if(m1l==='到Downtown'){var nd=nbData(name,ct);if(m2l==='中位价'){m1=nd.active+' 套';m1l='范围内房源';}else{m1='$'+nd.med+'万';m1l='社区售出中位价';}}return '<div class="cc" data-tap="'+name+'" data-kind="nb" data-city="'+ct+'" style="width:192px;flex:none;position:relative;overflow:hidden">'+cardBg((CX[ct]||{}).img)+'<div style="position:relative"><div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:7px"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">'+name+'</div><div class="muted" style="font-size:11px">'+sub+'</div></div></div><div style="font-size:11.5px;color:var(--color-text-secondary);line-height:1.45;margin-bottom:8px">'+line+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px"><div class="met"><div class="v">'+m1+'</div><div class="l">'+m1l+'</div></div><div class="met"><div class="v">'+m2+'</div><div class="l">'+m2l+'</div></div></div><div style="font-size:12px;color:#0F6E56;font-weight:500">查看详情 <i class="ti ti-chevron-right"></i></div></div></div>';}
  function citycard(name,sub,m1,m1l,m2,m2l){return '<div class="cc" data-tap="'+name+'" style="width:192px;flex:none;position:relative;overflow:hidden">'+cardBg((CX[name]||{}).img)+'<div style="position:relative"><div style="display:flex;align-items:center;gap:7px;margin-bottom:8px"><i class="ti ti-building-skyscraper" style="font-size:18px;color:#0F6E56"></i><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">'+name+'</div><div class="muted" style="font-size:11px">'+sub+'</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px"><div class="met"><div class="v">'+m1+'</div><div class="l">'+m1l+'</div></div><div class="met"><div class="v" style="color:#0F6E56">'+m2+'</div><div class="l">'+m2l+'</div></div></div><div style="font-size:12px;color:#0F6E56;font-weight:500">看该市详情 <i class="ti ti-chevron-right"></i></div></div></div>';}
  function districtcard(name,landmark,line,m1,m1l,m2,m2l,city){return '<div class="cc" data-tap="'+name+'" data-kind="district"'+(city?(' data-city="'+city+'"'):'')+' style="width:176px;flex:none"><div style="display:flex;align-items:center;gap:7px;margin-bottom:7px"><i class="ti ti-building-store" style="font-size:18px;color:#0F6E56"></i><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">'+name+'</div><div class="muted" style="font-size:11px">'+landmark+'</div></div></div><div style="font-size:11.5px;color:var(--color-text-secondary);line-height:1.45;margin-bottom:8px">'+line+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px"><div class="met"><div class="v">'+m1+'</div><div class="l">'+m1l+'</div></div><div class="met"><div class="v">'+m2+'</div><div class="l">'+m2l+'</div></div></div><div style="font-size:12px;color:#0F6E56;font-weight:500">查看详情 <i class="ti ti-chevron-right"></i></div></div>';}

  function crng(s){return function(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}
  function pN(p){return p==='1Y'?12:p==='5Y'?60:120;}
  function pX(p){if(p==='1Y')return ['1月','','3','','5','','7','','9','','11',''];var n=pN(p),lab=p==='5Y'?12:24,y0=2026-(p==='5Y'?5:10)+1,a=[];for(var i=0;i<n;i++)a.push(i%lab===0?(''+(y0+Math.floor(i/12))):'');return a;}

  function commCards(city,names){var L=['通勤便利 · 配套成熟','性价比高 · 生活方便','安静宜居 · 家庭友好','新盘较多 · 年轻活力','学区不错 · 公园多','交通枢纽 · 购物近'],h='<div style="display:flex;gap:9px;overflow-x:auto;padding-bottom:3px">';for(var i=0;i<names.length;i++){var sc=Math.max(72,90-i*2);h+=ncard(names[i],city+' · 社区',sc,L[i%L.length],(24+i*2)+'min','到Downtown',nbData(names[i],city).active+' 套','范围内房源');}return h+'</div>';}

）位于温哥华市中心半岛的核心地带，是整个大温哥华地区的商业、金融和文化枢纽。该社区三面环水，毗邻著名的史丹利公园、高尚住宅区煤港（Coal Harbour）以及历史悠久的耶鲁镇（Yaletown）。这里的房屋类型几乎全部为高层公寓，从豪华顶层公寓到紧凑型单身公寓应有尽有，展现了典型的高密度都市居住模式。社区内拥有罗布森街（Robson Street）购物区、太平洋中心商场、温哥华美术馆以及众多顶级餐厅和娱乐场所。得益于天车（SkyTrain）多条线路的交汇，这里的公共交通极其便利，步行指数极高。Downtown VW非常适合追求快节奏都市生活、注重生活便利性的年轻专业人士、留学生以及希望享受丰富城市配套的购房者居住。","生活成本相对较高。1. 居住空间局限：由于地处寸土寸金的市中心，房屋面积普遍较小，且缺乏大型户外私家空间，不适合需要宽敞活动空间的大家庭。2. 交通与停车困难：区域内车流量大，早晚高峰拥堵严重，且私人停车位极其昂贵且稀缺，高度依赖公共交通或步行。3. 城市噪音与治安：作为繁华的商业和娱乐中心，夜间和周末常有车辆、人群及活动噪音；同时，作为高密度市中心，部分区域存在流浪汉和轻微财产犯罪等典型的都市治安问题。4. 物业费高昂：高层公寓通常配备健身房、泳池等豪华设施，导致每月的物业管理费用较高，增加了长期的持有成本。"],"Dunbar":["西区豪宅 顶尖学区 绿树成荫 独立屋为主 邻近UBC 治安优良 社区安静 房价高昂 适合家庭","Dunbar社区（Dunbar）位于温哥华西区，西邻太平洋精神区域公园（Pacific Spirit Regional Park）和不列颠哥伦比亚大学（UBC），北接West Point Grey，东连Arbutus Ridge，南临菲沙河。该社区以其绿树成荫的安静街道、宽敞的独立屋和顶尖的教育资源而闻名，是温哥华最负盛名的传统富人区之一。区内房屋类型以大面积的独立屋为主，沿Dunbar街分布着少量联排别墅和低层公寓。这里拥有如Lord Byng中学和St. George's私校等顶级名校，吸引了大量重视教育的富裕家庭、专业人士以及UBC的教职员工在此定居。Dunbar Village商业街提供了丰富的餐饮、咖啡馆和日常购物选择，结合完善的社区中心和广阔的自然绿地，为居民打造了极为优质且宁静的生活环境。","生活成本与购房门槛极高。1. 房价高昂：作为温哥华传统西区的高端社区，独立屋价格动辄数百万加元，对普通购房者而言负担极大，且地税等持有成本较高。2. 交通方式单一：社区内没有天车（SkyTrain）等快速轨道交通覆盖，居民出行主要依赖私家车或公交车，前往市中心或大温其他地区在高峰期可能面临一定拥堵。3. 商业与娱乐设施有限：社区整体规划以纯住宅为主，除了Dunbar街的沿街商铺外，缺乏大型购物中心和丰富的夜生活，生活节奏较为缓慢。4. 房屋老旧与翻新限制：部分历史悠久的独立屋面临老化问题，且温哥华市对该区域的建筑翻新和改建有严格的审批规定。"],"Fairview VW":["医疗中心 交通枢纽 公寓为主 商业繁华 景观优美 设施完善 年轻白领 房价较高 投资热点","Fairview VW社区（Fairview）位于温哥华西区核心地带，北临福溪，南至16街，西起布勒街，东接甘比街。该社区是温哥华最具活力的城市中心之一，以卓越的地理位置和完善的生活配套闻名。社区内房屋类型以中高层公寓和联排别墅为主，极少有独立屋，非常适合追求都市便捷生活的年轻专业人士、医疗工作者及小家庭居住。Fairview拥有众多温哥华标志性地标，包括著名的格兰维尔岛（Granville Island）、繁华的南格兰维尔商业街以及省内最大的医疗机构温哥华综合医院（VGH）。得益于百老汇街走廊的商业繁荣和正在建设的百老汇地铁延长线，这里的公共交通极为便利。此外，福溪沿岸的海堤步道为居民提供了优美的滨水休闲空间，是体验温哥华西区高品质都市生活的理想之地。","生活成本相对较高。1. 交通拥堵与施工影响：作为重要交通枢纽，百老汇街及通往市中心的桥梁周边高峰期极为拥堵，且百老汇地铁线施工带来了长期的噪音和封路问题。2. 噪音干扰：由于温哥华综合医院（VGH）位于社区中心，救护车警笛声频繁，加上主干道车流密集，部分路段居住环境较为嘈杂。3. 居住密度高：该区以高密度公寓为主，居住空间相对较小，极度缺乏带院落的独立屋，不适合追求宽敞私密环境的大家庭。4. 购房与租房成本高昂：作为温西热门地段，这里的房价和租金均处于城市较高水平，整体生活成本压力较大。"],"False Creek":["海滨社区 景观优美 交通便利 公寓为主 租赁产权较多 靠近市中心 设施完善 步行友好 房价较高","False Creek社区位于温哥华市中心以南的水岸地带，是温哥华最具代表性的海滨居住区之一。该社区沿着美丽的福溪水域延伸，毗邻市中心、耶鲁镇以及著名的格兰维尔岛（Granville Island）。社区以高密度的高层和低层公寓为主，联排别墅为辅，几乎没有传统独立屋。这里拥有世界闻名的海滨步道（Seawall），居民可以尽情享受骑行、散步和水上活动。生活极其便利，周边布满各类餐厅、咖啡馆、精品店和社区中心，且水上巴士（AquaBus）和天车（SkyTrain）等公共交通四通八达。False Creek社区非常适合喜欢都市水岸生活、追求便利通勤的年轻专业人士、空巢老人以及小家庭居住，是一个充满活力且风景如画的现代化社区。","生活成本与房价相对较高。1. 产权问题：该社区特别是南福溪区域存在大量市政府租赁产权（Leasehold）物业，购房者需特别注意剩余租期及续约风险，这可能影响贷款和未来升值。2. 交通拥堵与噪音：地处城市核心区且靠近主要桥梁，高峰时段交通较为拥堵，部分靠近主干道的房屋可能面临噪音干扰。3. 建筑老化与维护：部分老旧公寓和联排别墅面临老化问题，可能需要缴纳高额的特殊维修费用于外墙或管道维护。4. 空间受限：房屋以公寓为主，居住空间相对较小，缺乏大型私人庭院。"],"Kerrisdale":["传统富人区 顶级学区 绿树成荫 商业繁华 独立屋为主 亚裔聚居 养老宜居 房价高昂 生活便利","Kerrisdale社区位于温哥华西区的中心地带，北接Arbutus Ridge，南邻Southlands，东连Oakridge，西接Dunbar-Southlands。该社区以其绿树成荫的街道、悠久的历史和浓厚的社区氛围而闻名。Kerrisdale的房屋类型丰富，以宽敞豪华的独立屋为主，同时在西41街的商业中心（Kerrisdale Village）附近也分布着不少低层和中层公寓及联排别墅。这里拥有极佳的教育资源，周边名校林立，如Magee中学、Point Grey中学以及顶尖私校Crofton House等，吸引了大量重视教育的家庭在此定居。此外，社区商业街店铺林立，餐饮、购物、医疗等生活设施一应俱全，不仅深受亚裔移民的青睐，也是许多退休人士安享晚年的理想之地。","生活成本与房价水平极高。1. 购房门槛高：作为温哥华传统的富人区，独立屋价格昂贵，且地税和维护成本较高，对普通家庭负担极大。2. 交通拥堵：西41街作为主要商业和交通干道，在高峰时段和周末经常出现交通拥堵，且停车位相对紧张。3. 房屋老旧与翻新限制：部分独立屋和低层公寓房龄较老，可能面临较高的维修费用，且温哥华市对老房屋的翻新和重建有严格的审批限制。4. 缺乏大型快速交通：目前社区内没有天车直达，公共交通主要依赖公交车，前往市中心或其他城市的通勤时间相对较长。"],"Kitsilano":["温西名区 海滩风情 商业繁华 交通便利 优质学区 年轻活力 绿地丰富 房价高昂 历史风貌 生活便利","Kitsilano社区（Kitsilano）位于温哥华西区的北部，北临英吉利湾，东接Burrard街，南至16街，西至Alma街。作为温哥华最著名的海滨社区之一，Kitsilano以其悠闲的生活方式、美丽的Kitsilano海滩以及标志性的户外盐水泳池而闻名。社区内绿树成荫，拥有众多历史悠久的特色独立屋、低层公寓和联排别墅，吸引了大量年轻专业人士、家庭以及不列颠哥伦比亚大学（UBC）的学生和教职员工在此居住。西4街和百老汇街是社区的商业核心，汇聚了众多精品店、知名餐厅、咖啡馆和瑜伽馆，生活极其便利。这里不仅拥有优质的教育资源，还享有壮丽的海景和北岸山脉景观，是一个融合了自然美景与都市活力的顶级居住区。","生活成本相对较高。1. 房价与租金高昂：作为温西热门海滨社区，Kitsilano的房地产价格在温哥华处于高端位置，购房和租房门槛极高。2. 房屋老旧与维护成本：区内保留了大量历史悠久的老房子，往往面临较高的翻新和日常维护成本，部分房屋存在结构老化问题。3. 交通与停车压力：夏季海滩游客众多，会导致周边道路拥堵和停车位紧张；百老汇街等主干道在高峰期交通流量大。4. 社区密度变化：随着百老汇地铁线的建设，部分区域正面临重新开发和密度增加，可能带来施工噪音及社区风貌改变。"],"MacKenzie Heights":["传统富人区 顶级学区 独立屋为主 绿树成荫 环境幽静 治安优良 交通依赖自驾 房价高昂 纯住宅区","麦肯齐高地（MacKenzie Heights）社区位于温哥华西区核心地带，东西两侧分别与Arbutus Ridge和Dunbar相邻。这是一个备受推崇的传统富人区，以宽阔的林荫大道和宁静的居住环境闻名。社区房屋类型几乎全部为占地较大的独立屋，既有经典老宅，也有近年翻建的豪华别墅，极少有公寓或联排。这里拥有顶级教育资源，周边名校林立，吸引了大量重视教育的高净值家庭定居。虽然社区内部以纯住宅为主，但居民只需短暂车程即可到达周边商圈享受便利配套，是温西兼具私密性与生活品质的顶级居住地。","购房与生活成本极高。1. 房价门槛高昂：作为温西顶级豪宅区，该社区几乎全是高价独立屋，缺乏入门级房产，地税和维护成本也可观。2. 公共交通有限：社区内无天车站点，出行高度依赖私家车。3. 商业配套缺乏：作为纯低密度住宅区，内部几乎无商业设施，日常购物需驱车前往相邻社区。4. 房屋老化问题：部分未翻新的老旧独立屋面临较高维修成本，且翻建审批流程繁琐。"],"Marpole":["历史悠久 交通枢纽 天车便利 房型多样 商业繁华 华人聚居 发展迅速 靠近机场 学区良好 投资热点","Marpole社区位于温哥华市最南端，南临菲沙河，北接Oakridge，是温哥华历史最悠久的社区之一。该社区地理位置优越，是连接温哥华与列治文及国际机场的重要门户。近年来，随着Marine Gateway等大型综合体落成，Marpole迎来了快速的现代化发展。房屋类型非常丰富，既有绿树成荫的传统独立屋，也有沿主要干道分布的低层公寓、联排别墅及新建高层公寓。社区生活极其便利，拥有大统华超市、电影院及各类餐厅，Canada Line天车线贯穿其中，通勤十分高效。此外，该区部分地段属于著名的Sir Winston Churchill中学学区，教育资源优越。Marpole非常适合年轻专业人士、新移民家庭以及寻求交通便利与生活配套的购房者居住。","生活成本与房价处于中等偏上水平。1. 交通拥堵与噪音：地处温哥华与列治文交界处且靠近机场，主要干道（如Oak街和Marine Drive）在高峰时段交通拥堵，部分区域会受飞机起降及车流噪音影响。2. 施工与密度增加：随着城市规划推进，该区正经历大规模重新开发与高密度建设，长期施工可能带来噪音和粉尘干扰。3. 房屋新旧差异大：社区内既有全新高层公寓，也有房龄较老的独立屋和低层木结构公寓，老旧房屋可能面临较高维护成本。4. 治安考量：虽然整体安全，但在商业密集区和天车站附近，偶尔会有轻微治安事件，需保持适当警惕。"],"Mount Pleasant VW":["温西核心 交通枢纽 天车便利 公寓为主 年轻时尚 历史底蕴 商业繁华 医疗资源 房价较高 投资热点","Mount Pleasant VW社区位于温哥华西区，西起Cambie街，东至Ontario街，北临福溪，南接16街。作为温哥华最具活力的社区之一，这里融合了历史底蕴与现代都市的繁华。社区房屋类型丰富，以新建公寓和现代联排别墅为主，同时保留了部分经典独立屋。这里是温哥华的重要交通枢纽，Broadway-City Hall天车站坐落于此，公共交通极其便利。社区毗邻温哥华市政厅，周边Cambie街和Broadway沿线商铺林立，餐饮、咖啡馆和精品店云集，生活配套极为完善。该社区吸引了大量年轻专业人士和注重生活品质的都市人群，是一个充满艺术气息、文化多元且极具投资潜力的优质居住区。","生活成本与房价相对较高。1. 交通拥堵与施工噪音：地处温哥华核心交通枢纽，Broadway沿线及Cambie街车流量大，且正处于百老汇地铁线施工期，部分路段存在明显的交通拥堵及噪音问题。2. 居住密度较高：社区以公寓和联排别墅为主，人口密度大，居住空间相对紧凑。3. 治安与噪音问题：靠近商业主干道和交通枢纽，人员流动性大，偶尔面临轻微的财产犯罪风险，主干道周边夜间可能有交通噪音。4. 房屋老化问题：部分保留的独立屋和低层老公寓房龄较长，可能面临较高的维护和翻新成本。"],"Oakridge VW":["华人聚居 顶级学区 天车便利 商业核心 豪宅林立 公寓新建 交通枢纽 绿化优美 房价高昂 发展潜力","Oakridge VW社区（Oakridge）位于温哥华西区的核心地带，北接South Cambie，南邻Langara。该社区以优越的地理位置和完善的生活配套闻名，是温哥华最具发展潜力的区域之一。目前，社区正经历以Oakridge Park大型综合体为核心的全面升级，未来将成为集高端零售和住宅为一体的城市副中心。房屋类型方面，该区传统上以占地宽阔的豪华独立屋为主，但随着Cambie走廊规划的推进，沿线新建了大量高端公寓和联排别墅。社区内交通极为便利，拥有加拿大线天车站，可快速直达市中心和机场。此外，这里教育资源顶尖，隶属于著名的Sir Winston Churchill中学学区，吸引了大量重视教育的华人家庭、专业人士及高净值人群在此安居。","生活成本与房价水平极高。1. 施工影响与交通拥堵：由于Oakridge Park及Cambie走廊沿线正在进行大规模重建和高密度开发，该区域将面临持续的施工噪音、粉尘及部分路段的交通拥堵。2. 购房门槛极高：作为温西核心地段，无论是独立屋还是新建公寓，价格均处于城市顶端，且伴随高昂的地税和物业费。3. 社区面貌变迁：高密度的公寓开发正在改变该区传统的低密度宁静居住氛围，人口密度显著增加。4. 学区竞争激烈：由于名校云集且家庭不断涌入，该区优质学校的入学竞争非常激烈，热门项目名额紧张。"],"Point Grey":["顶级学区 豪宅林立 海滩环绕 邻近UBC 环境优美 治安良好 房价极高 绿化率高 历史悠久","Point Grey社区（Point Grey）位于温哥华市的西端，北临英吉利湾，西接不列颠哥伦比亚大学（UBC），东至Alma街，南达16街。该社区是温哥华最负盛名且历史悠久的富人区之一，以其得天独厚的自然环境和顶级教育资源而闻名。社区内拥有著名的西班牙银行海滩（Spanish Banks）、洛卡诺海滩（Locarno Beach）和杰里科海滩（Jericho Beach），为居民提供了绝佳的休闲娱乐场所。房屋类型以占地面积广阔的豪华独立屋为主，辅以少量联排别墅和低层公寓，建筑风格多样，从历史悠久的传统大宅到现代风格的定制豪宅应有尽有。这里名校云集，包括著名的Lord Byng中学和顶尖私校West Point Grey Academy，吸引了大量重视教育的富裕家庭、专业人士及学者在此定居，是一个兼具自然美景与浓厚学术氛围的顶级宜居社区。","生活成本极高。1. 房价与地税高昂：作为温哥华最昂贵的社区之一，购房门槛极高，且每年的地税支出也是一笔巨大的开销，不适合预算有限的买家。2. 交通拥堵问题：由于靠近UBC，主干道（如10街和4街）在上下班及上下学高峰期经常出现严重的交通拥堵，且社区内缺乏天车等快速轨道交通，出行较为依赖私家车或公交。3. 房屋老旧与翻新限制：部分历史悠久的房屋面临老化问题，维护成本高，且温哥华市对特色房屋的拆建和翻新有严格的法规限制，开发灵活性较低。4. 商业配套有限：社区商业主要集中在10街沿线，大型购物中心较远，生活便利度不如市中心或本那比核心区。"],"Quilchena":["温西豪宅区 学区优质 环境优美 独立屋为主 治安良好 绿化率高 靠近商圈 房价高昂 适宜家庭","Quilchena社区位于温哥华西区的核心地带，北接Arbutus Ridge，南邻Kerrisdale，是一个以宁静优美和浓厚家庭氛围著称的高尚住宅区。该社区拥有大片绿地和参天古树，著名的Quilchena Park是居民休闲散步和家庭活动的热门场所。房屋类型以占地宽广、设计典雅的独立屋为主，同时在Arbutus购物中心附近也有少量高端联排别墅和公寓，满足不同家庭的需求。社区内教育资源极为丰富，拥有如Prince of Wales中学等顶尖公立学校，吸引了大量重视教育的家庭在此定居。此外，知名的私人俱乐部Arbutus Club也坐落于此，为会员提供顶级的体育和社交设施。凭借其优越的地理位置、顶级的学区资源以及安全宁静的居住环境，Quilchena成为了温哥华市内最受高净值家庭青睐的宜居社区之一。","生活成本相对较高。1. 房价与地税高昂：作为温西的传统富人区，该社区的独立屋价格极高，且每年的地税和房屋维护成本也是一笔不小的开销，购房门槛极高。2. 交通出行依赖私家车：社区内部以纯住宅为主，公共交通线路相对较少，居民日常通勤、购物或接送孩子上学通常高度依赖私家车。3. 房屋老旧与翻新限制：部分独立屋房龄较老，可能面临较高的维修和翻新成本，且温哥华市对该区域的房屋改建和树木砍伐有严格的审批限制。4. 商业配套相对分散：除了边缘的Arbutus购物中心外，社区内部缺乏大型商业设施，步行购物和餐饮选择有限。"],"S.W. Marine":["高端住宅 庄园地块 绿树成荫 隐私度高 独立屋为主 靠近UBC 菲沙河景 交通干道","S.W. Marine社区位于温哥华西区的西南边缘，北接Kerrisdale，南临菲沙河，西连Southlands。该社区以其幽静、低调奢华的居住氛围而闻名，绿树成荫的街道和宽敞的庄园式地块是其标志性特征。社区房屋类型以占地面积巨大的独立屋为主，许多房屋建于1946年以前，保留了早期的优雅风格，部分物业甚至享有菲沙河景。近年来，沿菲沙河区域也出现了一些公寓和联排别墅项目。社区内拥有Maple Grove Park、Riverview Park等多个绿地公园，并紧邻McCleery和Marine Drive两大高尔夫球场。这里非常适合追求大空间、高隐私度以及靠近UBC大学的富裕家庭、专业人士和教职员工居住。","该社区属于温哥华的高端住宅区，购房门槛极高。1. 房价与维护成本高昂：大面积地块和庄园式独立屋不仅售价高，日常的园林维护和房屋保养成本也十分可观。2. 交通依赖私家车：社区内公共交通相对有限，步行可达的商业设施较少，居民出行和购物高度依赖私家车。3. 交通干道噪音：S.W. Marine Drive是通往UBC和列治文的主要交通干道，沿线房屋可能会受到一定的交通噪音影响。"],"Shaughnessy":["顶级豪宅 历史风貌 绿树成荫 占地宽广 顶尖学区 纯住宅区 宁静私密 房价极高 传统富人区 交通便利","Shaughnessy社区位于温哥华市中心偏南的地理中心位置，北起16街，南至41街，东临Oak街，西接Arbutus街，是温哥华最负盛名且历史悠久的传统顶级富人区。该社区以其宽阔的林荫大道、占地广阔的庄园式豪宅以及深厚的历史底蕴而闻名。房屋类型几乎全部为独立屋，其中许多是建于20世纪初的经典历史建筑，散发着浓郁的英伦风情。社区内绿化极佳，环境宁静私密，周边名校林立，包括多所顶尖私立学校如York House和Little Flower Academy，教育资源极其优越。这里没有喧嚣的商业街区，纯粹的居住环境吸引了众多追求高品质生活、注重隐私与教育的富裕家庭、企业高管及专业人士在此安居。","生活成本极高。1. 购房与持有成本极高：作为温哥华最昂贵的社区之一，这里的房价、地税及大型房屋的日常维护费用均处于城市顶端。2. 房屋翻新受限：第一桑斯（First Shaughnessy）区域被划为历史遗产保护区，对房屋拆除、改建和外观翻新有极其严格的市政规定，限制了开发自由。3. 商业配套匮乏：社区内几乎没有零售店或餐厅，日常购物高度依赖私家车出行。4. 老宅维护挑战：许多百年老宅虽具魅力，但面临管道、电气老化等问题，需要投入大量资金进行专业修缮。"],"South Cambie":["核心地段 交通便利 名校云集 医疗资源 绿意盎然 豪宅林立 公寓新贵 房价高昂 华人青睐","South Cambie（南甘比）社区位于温哥华市中心偏南的核心地带，北起西16街，南至西41街，东西分别以甘比街和橡树街为界。该社区地理位置极为优越，紧邻著名的伊丽莎白王后公园，绿化覆盖率高，环境优美宜人。区内拥有不列颠哥伦比亚省儿童医院和妇女医院等顶级医疗资源，且学区极为优质，吸引了大量重视教育的家庭和专业人士定居。房屋类型方面，南甘比传统上以宽敞的高端独立屋为主，但随着甘比走廊计划的推进，甘比街沿线新建了大量现代化的中低层公寓和联排别墅，为社区注入了新的活力。得益于加拿大线天车（Canada Line）的便利交通，居民可快速直达温哥华市中心、列治文及温哥华国际机场，是一个兼具宁静生活与都市便利的顶级成熟社区。","购房与生活成本极为高昂。1. 房价门槛高：作为温哥华的高端社区，独立屋和新建公寓价格均处于城市顶端，资金要求极高。2. 交通与施工噪音：甘比街和橡树街是主要干道，高峰期车流量大，且甘比走廊沿线持续有密集的开发项目，部分路段面临长期施工噪音影响。3. 社区密度增加：随着城市规划改变，原本低密度的社区正向高密度发展，部分居民可能觉得生活空间受挤压。4. 医院周边影响：靠近儿童和妇女医院的区域可能会有救护车出入，偶尔带来警笛噪音。"],"South Granville":["温西豪宅区 独立屋为主 顶级学区 绿树成荫 交通干道 历史底蕴 治安良好 社区宁静 房价高昂 适合家庭","South Granville社区位于温哥华西区的南部，北起41街，南至64街，东临Oak街，西接Cypress街，是温哥华最负盛名的高端住宅区之一。该社区以宽敞的占地面积、绿树成荫的宁静街道及多样化的建筑风格闻名，从经典都铎风格到现代豪华别墅应有尽有。房屋类型以大户型独立屋为主，在Granville街和Oak街等干道沿线也分布着少量联排别墅和低层公寓。社区周边教育资源极为丰富，靠近Magee等优秀公立中学，并毗邻多所顶尖私校，是重视教育家庭的理想选择。社区内拥有Shannon Park等绿地，且距离列治文和机场仅几分钟车程，出行便利。这里主要吸引高收入专业人士、富裕家庭及寻求高品质生活的退休人群。","生活成本与房价水平极高。1. 购房门槛高昂：作为温西传统豪宅区，该社区以大占地独立屋为主，房价和地税均处于城市顶端，资金要求极高。2. 交通噪音与拥堵：Granville街和Oak街是连接温哥华与列治文的主要动脉，车流量极大，临近主干道的房屋面临明显噪音和早晚高峰拥堵。3. 房屋维护成本高：区内许多经典独立屋房龄较老，老旧房屋的翻新及园林保养需投入大量金钱。4. 商业配套分散：社区内部为纯住宅区，日常购物需驱车前往周边商圈，对私家车依赖度较高。"],"Southlands":["豪宅区 跑马场 乡村风情 占地面积大 独立屋为主 菲沙河畔 高尔夫球场 房价极高 绿化极佳 交通依赖自驾","Southlands社区位于温哥华市的西南部，南临美丽的菲沙河，是温哥华市内独一无二的保留了浓厚乡村风情与马术文化的顶级豪宅区。该社区以其宽广的占地面积、郁郁葱葱的绿化和宁静的田园生活方式而闻名。这里的房屋类型几乎全部为占地广阔的独立屋和豪华庄园，许多物业甚至配备了私人马厩。社区内拥有著名的Southlands马术俱乐部以及McCleery和Point Grey等顶级高尔夫球场，为居民提供了丰富的户外休闲选择。这里非常适合追求极致私密性、热爱大自然以及热衷马术运动的高净值家庭居住，让人在繁华都市中也能享受到世外桃源般的宁静生活。","生活成本极高。1. 洪水风险：由于紧邻菲沙河且地势较低，该社区部分区域位于洪泛区内，存在一定的水患风险，房屋保险成本可能较高。2. 交通与通勤不便：社区内公共交通极为有限，居民出行和日常购物高度依赖私家车，且距离温哥华市中心较远，通勤时间较长。3. 维护成本高昂：由于占地面积大且多为大型庄园或带有马厩的物业，房屋及庭院的日常维护需要投入大量的时间和金钱。4. 社区配套较少：为了保持乡村风貌，社区内缺乏大型商业中心和餐饮设施，生活便利度相对较低。"],"University VW":["UBC校区 学区顶尖 依山傍海 绿化极佳 公寓为主 华人聚居 租赁需求高 房价较高 交通便利 人文气息浓厚","University VW社区（University VW）位于温哥华西区的最西端，三面环海，东侧与西格雷角接壤，是著名的英属哥伦比亚大学（UBC）主校区及大学保留地所在地。该社区拥有得天独厚的自然环境，被广阔的太平洋精神区域公园环绕，并拥有著名的沉船海滩。社区内人文气息浓厚，拥有众多文化设施。房屋类型以高层和低层公寓为主，辅以部分联排别墅和少量占地广阔的独立屋，其中许多物业为预付租赁产权（Leasehold）。凭借顶尖的公立学校（如University Hill中小学）和优美的居住环境，该社区吸引了大量学生、教职员工、华人家庭以及注重教育和生活品质的买家，是一个充满活力且学术氛围浓厚的优质居住区。","生活成本与房价相对较高。1. 产权问题：社区内大量公寓和联排别墅属于预付租赁产权（Leasehold），随着剩余租期减少，房屋贷款难度可能增加，且升值潜力通常不及永久产权物业。2. 交通与通勤：目前该区域尚未开通天车，进出社区主要依赖公交车或私家车，高峰时段主要通道容易出现交通拥堵。3. 社区流动性大：由于是大学城，租客比例较高，学生群体流动性大，部分区域在开学期间可能较为喧闹，且假期时社区显得相对冷清。4. 商业配套有限：虽然校内有基本的生活超市和餐饮，但大型购物中心和多样化的商业设施需前往温哥华其他区域。"],"West End VW":["市中心 斯坦利公园 英吉利湾 公寓为主 步行指数高 餐饮丰富 租客众多 活力社区 房价较高","西端社区（West End VW）位于温哥华市中心半岛的西南部，是温哥华人口最密集、最具活力的社区之一。该社区北临著名的斯坦利公园（Stanley Park），南接美丽的英吉利湾（English Bay），东侧紧邻温哥华商业中心区。West End的房屋类型以高层和低层公寓为主，穿插着少量历史悠久的独立屋和联排别墅，非常适合喜欢都市便利生活的年轻专业人士、单身人士以及小家庭居住。社区内拥有著名的Robson街、Denman街和Davie街，提供极其丰富的餐饮、购物和娱乐选择。这里步行指数极高，居民可以轻松步行前往海滩、公园和市中心办公区，享受自然景观与繁华都市完美结合的独特生活方式。","生活成本相对较高。1. 交通拥堵与停车困难：由于地处市中心且人口密度极高，街道狭窄，高峰期交通拥堵严重，且停车位非常稀缺且昂贵。2. 房屋老旧问题：该区有大量建于上世纪六七十年代的老旧公寓，可能面临较高的维护费用、特殊分摊费以及潜在的漏水问题。3. 噪音与治安：作为繁华的商业和娱乐中心，部分临街区域夜间噪音较大，且市中心边缘地带偶尔会面临一些治安和流浪汉问题。4. 空间狭小：房屋面积普遍较小，对于需要大空间的家庭来说可能不够宽敞。"],"Yaletown":["市中心核心 豪华公寓 历史仓库改造 天车便利 海堤步道 餐饮购物 繁华夜生活 年轻专业人士 步行友好 房价高昂","耶鲁镇（Yaletown）社区位于温哥华市中心的东南部，毗邻福溪（False Creek），是温哥华最时尚、最具活力的都市生活区之一。该社区曾是工业仓库区，如今已成功转型为高密度的高尚住宅区，保留了大量历史悠久的红砖仓库建筑，并将其改造为别具一格的阁楼（Loft）、精品店和高级餐厅。社区内的房屋类型绝大多数为现代高层豪华公寓和特色联排别墅，享有壮丽的城市天际线和水景。耶鲁镇拥有完善的社区设施，包括著名的海堤步道（Seawall）、大卫林公园（David Lam Park）以及加拿大线（Canada Line）天车站，交通极其便利。这里汇聚了众多顶级餐饮、时尚精品店和繁华的夜生活场所，非常适合追求高品质都市生活的年轻专业人士、丁克家庭以及富裕阶层居住，是温哥华现代都市魅力的缩影。","生活成本与房价水平极高。1. 居住空间局限：作为市中心的高密度社区，房屋以公寓为主，面积普遍较小，且缺乏适合大家庭的大型住宅。2. 噪音与拥挤问题：繁华的夜生活、密集的餐饮商业以及繁忙的交通，导致该区域在夜间和周末可能面临较大的噪音干扰，且街道停车位极为紧张。3. 治安隐患：尽管整体安全，但作为市中心区域，仍存在一定程度的财产犯罪（如砸车窗）和流浪汉问题。4. 交通拥堵：进出市中心的主要干道在高峰时段经常拥堵，对高度依赖私家车通勤的居民不够友好。"],"Champlain Heights":["绿地环绕 联排为主 租赁产权 价格亲民 家庭友好 宁静宜居 靠近公园 房屋老旧","Champlain Heights社区位于温哥华市东南部，毗邻本那比市，是一个以绿地和自然环境著称的宁静住宅区。该社区主要在20世纪70至80年代开发，以其独特的城市规划闻名，保留了大量树木和自然景观。社区内房屋类型以联排别墅为主，辅以部分独立屋和低层公寓。值得注意的是，这里有相当一部分物业属于温哥华市政府的预付租赁产权（Leasehold），这使得该社区房价在温哥华市内相对亲民。社区内拥有广阔的Everett Crowley公园和社区中心，提供丰富的休闲运动设施。这里环境优美、生活节奏悠闲，非常适合注重自然环境、追求高性价比的家庭、首次购房者及退休人士居住。","房屋性价比高但需权衡产权性质。1. 租赁产权限制：社区内大量物业为市政府预付租赁产权（Leasehold），随着剩余租期缩短，房屋升值潜力和贷款审批可能受影响，转售难度较高。2. 房屋老化：大部分房屋建于上世纪70至80年代，买家可能面临较高的维护和翻新成本。3. 交通依赖私家车：距离天车站有一定距离，日常出行和通勤相对更依赖私家车。4. 商业配套有限：社区以纯住宅和公园为主，大型商业较少，购物通常需前往邻近的Metrotown商圈。"],"Collingwood VE":["华人聚居 交通便利 天车沿线 房型多样 生活便利 商业繁华 投资自住皆宜 多元文化 亚裔社区 密度较高","Collingwood VE社区（Collingwood VE）位于温哥华东部边缘，东临本那比市，是温哥华最具活力的多元文化社区之一。该区交通极为便利，拥有Joyce-Collingwood天车站，Kingsway主干道贯穿其中，提供丰富的商业与餐饮服务。社区房屋类型多样，天车站周边以高层公寓和联排别墅为主，内街则分布着大量经典的温哥华特色屋和较新的独立屋。这里生活气息浓厚，周边有Renfrew社区中心，且紧邻本那比中央公园。Collingwood VE吸引了大量新移民、年轻专业人士和家庭定居，华人及亚裔人口比例较高，是兼具自住与投资价值的成熟社区。","生活成本在温哥华市内相对适中，但需注意以下几点：1. 交通与噪音：Kingsway沿线及天车站周边车流量大，部分区域易受交通和天车运行噪音影响。2. 社区密度与治安：天车站周边高密度住宅不断开发，人口密度增大，商业区和交通枢纽附近人员流动较杂，需留意治安状况。3. 房屋老旧：社区内部分独立屋房龄较老，购买时可能面临较高的维护和翻新成本。4. 停车紧张：高密度公寓区和商业街附近的街边停车位较为紧张，对依赖私家车出行的居民可能造成不便。"],"Downtown VE":["市中心边缘 历史建筑 公寓为主 交通便利 价格洼地 治安堪忧 设施齐全 人口密集","Downtown VE（Downtown Eastside，市中心东端）位于温哥华市中心东侧，毗邻煤气镇（Gastown）、华埠（Chinatown）和士达孔拿（Strathcona）。作为温哥华历史最悠久的街区之一，这里保留了大量早期建筑，近年来也经历了部分士绅化发展。社区房屋类型以公寓为主，包括一些由历史建筑改造的特色Loft和新建的高层公寓，独立屋和联排别墅极为罕见。该区域拥有丰富的历史文化底蕴，靠近市中心核心区，交通极其便利，步行即可到达天车站和众多公交线路。这里适合寻求城市中心生活、喜欢历史文化氛围、且对价格较为敏感的年轻专业人士、艺术家和单身人士居住。","生活成本相对较低，但需权衡复杂的社会环境。1. 治安与社会问题：该区域是温哥华著名的社会问题集中地，部分街区存在较高的无家可归者比例、公开的毒品使用和较高的财产犯罪率，治安状况是最大的考量因素。2. 噪音与拥挤：地处市中心边缘，交通繁忙，人口密度大，日常生活中可能面临较高的噪音水平。3. 房屋老旧与限制：部分公寓由老旧建筑改造，可能面临较高的维护成本或特殊的物业限制。4. 社区环境差异大：街区之间的环境差异显著，部分区域正在快速士绅化，而相邻街区可能仍面临严重的社会挑战。"],"Fraser VE":["多元文化 独立屋为主 餐饮丰富 交通便利 社区氛围浓厚 适合家庭 房价中等 发展潜力大 设施完善 绿树成荫","Fraser VE社区（Fraser VE）位于温哥华东区中心，主要沿Fraser Street南北延伸，北起东16街，南至东49街。该社区以浓厚的多元文化氛围和充满活力的商业街区闻名，沿线聚集了众多独立咖啡馆、特色餐厅和精品小店，生活极为便利。社区房屋类型以独立屋为主，包括许多经典的“温哥华特色屋”和历史悠久的特色建筑，近年来也增加了沿街的低层公寓和联排别墅。Fraser VE拥有Memorial South Park等多个公园，绿树成荫，非常适合家庭居住。这里交通网络发达，多条公交线路直达市中心及天车站，吸引了大量年轻专业人士和家庭在此安家，是一个兼具传统魅力与现代活力的宜居社区。","生活成本与房价处于温哥华市内的中等水平。在该社区置业或居住的主要风险与权衡包括：1. 交通与停车压力：Fraser Street作为主要干道，高峰时段交通较为拥堵，部分老旧独立屋缺乏充足停车位，街边停车紧张。2. 房屋老旧与维护成本：社区内存在大量房龄较长的独立屋，购房者需承担较高的翻新和日常维护成本，并注意老旧房屋的隐蔽缺陷。3. 密度增加带来的变化：随着城市规划推进，主干道沿线开发密度增加，可能带来施工噪音及社区风貌改变。4. 噪音干扰：靠近商业街和交通干道的区域可能面临车辆及夜间噪音干扰，影响居住的安静程度。"],"Fraserview VE":["华人聚居 独立屋为主 绿化极佳 高尔夫球场 菲沙河景 家庭友好 宁静宜居 坡地地形 房价中等","Fraserview VE社区位于温哥华东南部，南临美丽的菲沙河，北接41街，西至Knight街，东临Elliott街。该社区建在温哥华的南坡上，许多房屋都能俯瞰菲沙河及列治文的壮丽景色。Fraserview是一个宁静且家庭友好的传统住宅区，房屋类型以宽敞的独立屋为主，近年来也增加了一些联排别墅和低层公寓。社区内绿树成荫，拥有著名的Fraserview高尔夫球场以及Bobolink公园等大片绿地，为居民提供了极佳的户外休闲空间。这里人口构成多元，深受华人及南亚裔家庭的青睐。虽然社区内部以纯居住为主，但邻近的Victoria Drive提供了丰富的餐饮和购物选择，非常适合追求安静生活环境、注重家庭生活质量且喜欢自然风光的购房者。","生活成本相对较高。1. 交通依赖度较高：社区内公共交通主要依赖公交车，距离天车（SkyTrain）站点较远，日常出行和通勤更适合自驾。2. 商业配套有限：社区内部主要为纯住宅区和高尔夫球场，大型购物中心和餐饮设施较少，需前往周边社区（如Victoria Drive或列治文）满足生活需求。3. 房屋老旧与翻新成本：区内部分独立屋房龄较老，购房者可能需要承担较高的房屋维护或翻新成本。4. 坡地地形：部分区域位于较陡的坡地上，冬季降雪时道路湿滑，可能对行车和步行安全造成一定影响。"],"Grandview Woodland":["文化多元 商业繁华 交通枢纽 天车便利 独立屋为主 历史风貌 餐饮丰富 步行友好 房价中高 社区活跃","Grandview Woodland社区（Grandview Woodland）位于温哥华市东部，西起Clark Drive，东至Nanaimo Street，南临East 12th Avenue，北接Burrard Inlet。该社区以其核心商业街Commercial Drive（俗称“The Drive”）而闻名，这里曾是温哥华著名的“小意大利”，如今汇聚了丰富多样的异国餐厅、独立咖啡馆、特色精品店和充满活力的街头文化。社区内的房屋类型丰富多样，包括许多具有历史风貌的经典独立屋、低层公寓以及新建的联排别墅，保留了浓厚的历史底蕴。Grandview Woodland拥有极佳的公共交通网络，Commercial-Broadway天车站是温哥华最重要的交通枢纽之一，连接着世博线和千禧线，出行极为便利。这里公园绿地众多，如Grandview Park和Victoria Park，为居民提供了充足的休闲空间。该社区文化氛围浓厚，非常适合喜欢城市活力、追求多元文化体验的年轻专业人士、艺术家以及家庭居住。","生活成本与房价处于中高水平。1. 交通与停车压力：作为热门商业区和交通枢纽，Commercial Drive周边及主要干道在高峰期交通较为拥堵，且部分住宅街道停车位紧张。2. 治安与噪音问题：靠近天车站和繁华商业街的区
